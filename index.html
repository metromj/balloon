<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리더보드</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script src = 'script.js' defer></script>
    <link rel='stylesheet', href='style.css' defer>
</head>
<body>
    <div id = 'container'>
        <header>
            <h1><p id = 'title'>풍비박산</p> 리더보드</h1>
        </header>
        <div id = 'ichiban' class = "podium">
            <img src = "1place.png">
            <p id = 'first'>황규진 0점</p>
        </div>
        <div id = 'niban' class = "podium">
            <img src = "2place.png">
            <p id = 'second'>황규진 0점</p>
        </div>
        <div id = 'sanban' class = "podium">
            <img src = "3place.png">
            <p id = 'third'>황규진 0점</p>
        </div>
        <div>
            <ol start = "4">
                <li id = 'fourth'>황규진 0점</li>
                <li id = 'fifth'>황규진 0점</li>
                <li id = 'sixth'>황규진 0점</li>
                <li id = 'seventh'>황규진 0점</li>
                <li id = 'eighth'>황규진 0점</li>
                <li id = 'ninth'>황규진 0점</li>
                <li id = 'tenth'>황규진 0점</li>
            </ol>
        </div>
        <div id = 'input'>
            <h2>내 기록 입력</h2>
            <div class="input-container">
                <p class="input-tag">닉네임: </p>
                <input name = 'nickname', id = 'nickname', required/>
            </div>
            <div class="input-container">
                <p class = "input-tag">점수: </p>
                <input name = 'score', id = 'score', required/>
            </div>
            <div class="input-container">
                <p class = "input-tag">실명: </p>
                <input name = 'score', id = 'realname' , placeholder = "리더보드에는 표시 X", required/>
            </div>
            <div class="buttons">
                <button id = 'return'>등록</button>
                <button id = 'cancel'>취소</button>     
            </div>
        </div>
        <footer>
            <p>이 웹페이지는 생성형 인공지능을 사용하지 않고 만들어졌습니다. &copy; 2026 Myungjae Lee</p>
        </footer>
        <div>
            <button id = 'tools'>관리자 툴</button>
            <input type = "file", accept = ".csv", id = 'csvInput', class = "hidden"/>
            <button id = 'csvBtn', class = "hidden">CSV 다운로드</button>
        </div>
    </div>
</body>
</html>
